pre-commit:
  commands:
    lint:
      glob: "*.go"
      run: golangci-lint run --config .golangci.yml {staged_files}
      exclude:
        - "gen/**"

    vet:
      glob: "*.go"
      run: go vet {staged_files}
      exclude:
        - "gen/**"

pre-push:
  commands:
    test:
      run: go test -short -count=1 ./pkg/... ./gen/... ./services/... ./cmd/...
